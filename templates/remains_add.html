<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление | Радиоуглеродное датирование</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/remains.css') }}?v={{ style_version }}">
</head>
<body>
    <main class="phone light-screen">
        <header class="page-heading draft-heading">
            <h1>Новый тип<br>останков</h1>
        </header>
        <form class="remains-form" autocomplete="off">
            <div class="draft-scroll">
                <fieldset class="media-fields">
                    <legend class="visually-hidden">Фото и видео останков</legend>
                    <div class="media-field">
                        <span class="field-caption">Изображение</span>
                        <img class="draft-photo" src="{{ draft_remains.image }}" alt="{{ draft_remains.title }}">
                    </div>
                    <div class="media-field">
                        <span class="field-caption">Видео</span>
                        <video class="draft-video" src="{{ draft_remains.video }}" controls muted playsinline preload="metadata" aria-label="Видео: {{ draft_remains.title }}"></video>
                    </div>
                </fieldset>
                <fieldset class="text-fields">
                    <legend class="visually-hidden">Описание и параметры останков</legend>
                    <label class="form-field"><span>Название останков</span><input name="title" type="text" value="{{ draft_remains.title }}" readonly></label>
                    <label class="form-field"><span>Описание</span><textarea name="description" rows="3" readonly>{{ draft_remains.description }}</textarea></label>
                    <label class="form-field"><span>Время анализа, рабочих дней</span><input name="analysis_time_days" type="number" value="{{ draft_remains.analysis_time_days }}" readonly></label>
                    <label class="form-field"><span title="Образец: {{ draft_remains.carbon_14_sample }}">Содержание C‑14, pMC</span><input name="carbon_14_pmc" type="number" value="{{ draft_remains.carbon_14_pmc }}" readonly></label>
                </fieldset>
            </div>
            <button class="submit-button" type="button">Добавить</button>
        </form>
        <nav class="bottom-tabs" aria-label="Разделы">
            <a class="tab" href="/remains/feed">Лента</a>
            <a class="tab active" aria-current="page" href="/remains/draft">Добавление</a>
            <a class="tab" href="/remains">Плитка</a>
        </nav>
    </main>
</body>
</html>
