{% macro like_control(title, count, liked, placement) -%}
<label class="like-control {{ placement }}">
    <input class="like-toggle" type="checkbox" aria-label="Нравится: {{ title }}" autocomplete="off" {% if liked %}checked{% endif %}>
    <span class="like-text" aria-hidden="true">
        <span class="heart heart-outline">♡</span><span class="heart heart-filled">♥</span>
        <span class="count-off">{{ count }}</span><span class="count-on">{{ count + 1 }}</span>
    </span>
</label>
{%- endmacro %}
