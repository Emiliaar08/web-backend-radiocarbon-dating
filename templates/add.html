{% extends 'index.html' %}
{% block title %}Добавление{% endblock %}
{% block content %}
    <header class="page-heading draft-heading">
        <h1>Новый тип<br>останков</h1><span class="draft-label">Черновик</span>
    </header>
    <form class="remains-form" autocomplete="off">
        <div class="draft-scroll">
            <fieldset class="media-fields">
                <legend class="visually-hidden">Фото и видео останков</legend>
                <div class="media-field">
                    <label class="field-caption" for="image_url">Изображение</label>
                    <img class="draft-photo" src="{{ draft_remains.image }}" alt="{{ draft_remains.title }}">
                    <div class="url-field">
                        <input class="file-picker" id="photo_file" type="file" accept="image/*" aria-label="Новое изображение" title="" required>
                        <label class="folder-button" for="photo_file" aria-label="Выбрать изображение"><img src="{{ icons.folder }}" alt=""></label>
                        <input id="image_url" name="image_url" type="url" value="{{ draft_remains.image }}" autocomplete="off" spellcheck="false">
                    </div>
                </div>
                <div class="media-field">
                    <label class="field-caption" for="video_url">Видео</label>
                    <video class="draft-video" src="{{ draft_remains.video }}" controls muted playsinline preload="metadata" aria-label="Видео: {{ draft_remains.title }}"></video>
                    <div class="url-field">
                        <input class="file-picker" id="video_file" type="file" accept="video/*" aria-label="Новое видео" title="" required>
                        <label class="folder-button" for="video_file" aria-label="Выбрать видео"><img src="{{ icons.folder }}" alt=""></label>
                        <input id="video_url" name="video_url" type="url" value="{{ draft_remains.video }}" autocomplete="off" spellcheck="false">
                    </div>
                </div>
            </fieldset>
            <fieldset class="text-fields">
                <legend class="visually-hidden">Описание и параметры останков</legend>
                <label class="form-field"><span>Название останков</span><input name="title" type="text" value="{{ draft_remains.title }}" autocomplete="off"></label>
                <label class="form-field"><span>Описание</span><textarea name="description" rows="3" autocomplete="off">{{ draft_remains.description }}</textarea></label>
                <label class="form-field"><span>Время анализа, рабочих дней</span><input name="analysis_time_days" type="number" min="1" step="1" value="{{ draft_remains.analysis_time_days }}" autocomplete="off"></label>
                <label class="form-field"><span title="Образец: {{ draft_remains.carbon_14_sample }}">Содержание C‑14, pMC</span><input name="carbon_14_pmc" type="number" min="0" step="0.001" value="{{ draft_remains.carbon_14_pmc }}" autocomplete="off"></label>
            </fieldset>
        </div>
        <button class="submit-button" type="reset">Добавить</button>
    </form>
{% endblock %}
