<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="690" viewBox="0 0 1360 690"><rect width="1360" height="690" fill="white"/><g font-family="Arial,sans-serif" fill="#20242a"><text x="40" y="38" font-size="22" font-weight="700">Radiocarbon dating — PostgreSQL</text><rect x="40" y="80" width="400" height="112" fill="white" stroke="#454545"/><rect x="40" y="80" width="400" height="32" fill="#e8eef7" stroke="#454545"/><text x="52" y="102" font-size="17" font-weight="700">researchers</text><text x="50" y="132" font-size="13" fill="#316db2">PK</text><text x="83" y="132" font-size="14">id</text><text x="275" y="132" font-size="12">INTEGER NOT NULL</text><text x="50" y="156" font-size="13" fill="#316db2">UQ</text><text x="83" y="156" font-size="14">username</text><text x="275" y="156" font-size="12">VARCHAR(80) NOT NULL</text><text x="50" y="180" font-size="13" fill="#316db2"></text><text x="83" y="180" font-size="14">full_name</text><text x="275" y="180" font-size="12">VARCHAR(160) NOT NULL</text><rect x="740" y="80" width="560" height="352" fill="white" stroke="#454545"/><rect x="740" y="80" width="560" height="32" fill="#e8eef7" stroke="#454545"/><text x="752" y="102" font-size="17" font-weight="700">remains</text><text x="750" y="132" font-size="13" fill="#316db2">PK</text><text x="783" y="132" font-size="14">id</text><text x="975" y="132" font-size="12">INTEGER NOT NULL</text><text x="750" y="156" font-size="13" fill="#316db2"></text><text x="783" y="156" font-size="14">title</text><text x="975" y="156" font-size="12">VARCHAR(120) NOT NULL</text><text x="750" y="180" font-size="13" fill="#316db2"></text><text x="783" y="180" font-size="14">description</text><text x="975" y="180" font-size="12">VARCHAR(2000)</text><text x="750" y="204" font-size="13" fill="#316db2"></text><text x="783" y="204" font-size="14">status</text><text x="975" y="204" font-size="12">VARCHAR(16) NOT NULL</text><text x="750" y="228" font-size="13" fill="#316db2"></text><text x="783" y="228" font-size="14">image_url</text><text x="975" y="228" font-size="12">VARCHAR(1024)</text><text x="750" y="252" font-size="13" fill="#316db2"></text><text x="783" y="252" font-size="14">video_url</text><text x="975" y="252" font-size="12">VARCHAR(1024)</text><text x="750" y="276" font-size="13" fill="#316db2"></text><text x="783" y="276" font-size="14">analysis_time_days</text><text x="975" y="276" font-size="12">INTEGER</text><text x="750" y="300" font-size="13" fill="#316db2"></text><text x="783" y="300" font-size="14">carbon_14_pmc</text><text x="975" y="300" font-size="12">NUMERIC(7, 3)</text><text x="750" y="324" font-size="13" fill="#316db2"></text><text x="783" y="324" font-size="14">carbon_14_sample</text><text x="975" y="324" font-size="12">VARCHAR(160)</text><text x="750" y="348" font-size="13" fill="#316db2"></text><text x="783" y="348" font-size="14">carbon_14_source</text><text x="975" y="348" font-size="12">VARCHAR(1024)</text><text x="750" y="372" font-size="13" fill="#316db2"></text><text x="783" y="372" font-size="14">created_at</text><text x="975" y="372" font-size="12">TIMESTAMP WITH TIME ZONE NOT NULL</text><text x="750" y="396" font-size="13" fill="#316db2">FK</text><text x="783" y="396" font-size="14">creator_id</text><text x="975" y="396" font-size="12">INTEGER NOT NULL</text><text x="750" y="420" font-size="13" fill="#316db2"></text><text x="783" y="420" font-size="14">published_at</text><text x="975" y="420" font-size="12">TIMESTAMP WITH TIME ZONE</text><rect x="40" y="420" width="400" height="112" fill="white" stroke="#454545"/><rect x="40" y="420" width="400" height="32" fill="#e8eef7" stroke="#454545"/><text x="52" y="442" font-size="17" font-weight="700">remains_likes</text><text x="50" y="472" font-size="13" fill="#316db2">PK</text><text x="83" y="472" font-size="14">id</text><text x="275" y="472" font-size="12">INTEGER NOT NULL</text><text x="50" y="496" font-size="13" fill="#316db2">FK</text><text x="83" y="496" font-size="14">researcher_id</text><text x="275" y="496" font-size="12">INTEGER NOT NULL</text><text x="50" y="520" font-size="13" fill="#316db2">FK</text><text x="83" y="520" font-size="14">remains_id</text><text x="275" y="520" font-size="12">INTEGER NOT NULL</text><g fill="none" stroke="#316db2" stroke-width="2"><path d="M440 150H740 M240 192V420 M740 390H590V480H440"/></g><g font-size="14"><text x="455" y="139">1</text><text x="697" y="139">0..*</text><text x="550" y="136">creator_id</text><text x="250" y="215">1</text><text x="250" y="406">0..*</text><text x="253" y="310">researcher_id</text><text x="714" y="377">1</text><text x="452" y="466">0..*</text><text x="605" y="378">remains_id</text></g><g font-size="14"><text x="40" y="590">UNIQUE remains(creator_id) WHERE status = 'draft'</text><text x="40" y="616">UNIQUE remains_likes(researcher_id, remains_id); all foreign keys: ON DELETE RESTRICT</text><text x="40" y="642">remains.status: draft | published | deleted; published records require description, both numeric fields and published_at</text></g></g></svg>
